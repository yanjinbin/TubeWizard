<!DOCTYPE html>
<html><head><style>
  *{margin:0;padding:0}
  html,body{width:512px;height:512px;overflow:hidden;background:transparent}
</style></head>
<body>
<svg width="512" height="512" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4136"/>
      <stop offset="1" stop-color="#d40000"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#5b2bd6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="14" y="14" width="100" height="100" rx="26" fill="url(#red)" filter="url(#soft)"/>
  <!-- subtle top highlight -->
  <rect x="14" y="14" width="100" height="50" rx="26" fill="#ffffff" opacity="0.10"/>

  <!-- play triangle -->
  <path d="M52 44 L52 92 L88 68 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6"
        stroke-linejoin="round" transform="translate(2,4)"/>

  <!-- wizard hat, tilted, top-left -->
  <g filter="url(#soft)" transform="rotate(-14 40 40)">
    <!-- brim -->
    <ellipse cx="40" cy="56" rx="34" ry="8" fill="url(#purple)"/>
    <ellipse cx="40" cy="55" rx="34" ry="7" fill="#7a4ae0"/>
    <!-- cone -->
    <path d="M40 -2 C 48 22 50 40 60 53 C 50 58 30 58 20 53 C 30 40 32 22 40 -2 Z" fill="url(#purple)"/>
    <!-- band -->
    <path d="M24 48 C 34 53 46 53 56 48 L 54 43 C 45 47 35 47 26 43 Z" fill="#3f1f8a"/>
    <!-- stars -->
    <g fill="#ffd93d">
      <path d="M38 16 l1.6 4.4 4.6 .3 -3.6 2.9 1.2 4.5 -3.8 -2.6 -3.8 2.6 1.2 -4.5 -3.6 -2.9 4.6 -.3 Z"/>
      <circle cx="48" cy="34" r="1.6"/>
      <circle cx="30" cy="38" r="1.3"/>
    </g>
  </g>
</svg>
</body></html>
