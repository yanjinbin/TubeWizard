<!DOCTYPE html>
<html>
<head>
<style>
  * { margin:0; padding:0; }
  html,body { width:128px; height:128px; overflow:hidden; background:transparent; }
  .wrap { width:128px; height:128px; display:grid; place-items:center; }
  .tile {
    width:104px; height:104px; border-radius:26px;
    background: linear-gradient(145deg, #ff3b30 0%, #d50000 100%);
    box-shadow: 0 6px 16px rgba(213,0,0,0.45), inset 0 2px 3px rgba(255,255,255,0.25);
    display:grid; place-items:center;
  }
  .tri {
    width:0; height:0;
    border-style:solid;
    border-width:24px 0 24px 40px;
    border-color: transparent transparent transparent #ffffff;
    margin-left:8px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  }
</style>
</head>
<body>
  <div class="wrap"><div class="tile"><div class="tri"></div></div></div>
</body>
</html>
